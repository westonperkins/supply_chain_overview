[pytest]
# Pass Q.1 §4 — pin the invocation.
#
# Before this file, `pytest backend/tests` gave 3 failed / 107 passed
# while `python -m pytest backend/tests` gave 110 passed. The `-m` form
# put the repo root on sys.path, letting three tests use `backend.*`
# imports; the bare form did not. Suite state was invocation-dependent
# and neither form was pinned.
#
# Q.1.4 also rewrote the three offending imports to match the suite
# convention (`app.*` and `scripts.*` — both importable because
# `backend/` is on sys.path). This file makes the invocation guarantee
# permanent: `pytest`, `pytest backend/tests`, and `python -m pytest`
# all resolve to the same suite state.
testpaths = backend/tests
pythonpath = backend
